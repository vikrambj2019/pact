<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pact · MVP1 C2C</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3e;
    --text: #e2e8f0; --muted: #6b7280; --accent: #6366f1;
    --accent-hover: #818cf8; --success: #22c55e; --warn: #f59e0b;
    --danger: #ef4444; --user-bg: #1e3a5f; --bot-bg: #1a2535;
    --radius: 8px; --radius-lg: 12px;
  }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; gap: 12px; background: var(--surface); flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 700; }
  header .meta { color: var(--muted); font-size: 12px; }
  #setup-screen { flex: 1; overflow-y: auto; padding: 32px; display: flex;
    justify-content: center; align-items: flex-start; }
  #setup-inner { width: 100%; max-width: 700px; }
  #setup-inner h2 { margin-bottom: 24px; font-size: 22px; }
  #main-screen { flex: 1; display: flex; overflow: hidden; }
  .panel { display: flex; flex-direction: column; flex: 1; overflow: hidden;
    border-right: 1px solid var(--border); }
  .panel:last-child { border-right: none; }
  .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); font-weight: 600; font-size: 13px; flex-shrink: 0; display: flex;
    justify-content: space-between; align-items: center; }
  .panel-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
  /* form elements */
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 14px; }
  label:first-child { margin-top: 0; }
  input[type=text], textarea, select {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius); padding: 8px 10px; font-size: 13px; font-family: inherit; }
  input[type=text]:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .range-val { font-size: 12px; color: var(--muted); text-align: right; margin-top: 2px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .checkbox-row input { width: auto; accent-color: var(--accent); }
  .checkbox-row label { margin: 0; color: var(--text); font-size: 13px; }
  .bot-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px; margin-top: 12px; }
  .bot-card summary { cursor: pointer; font-weight: 600; font-size: 13px; user-select: none; }
  .bot-card-body { margin-top: 12px; }
  btn, button { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border: none; border-radius: var(--radius); padding: 8px 16px; font-size: 13px;
    font-family: inherit; font-weight: 500; transition: opacity .15s; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-danger { background: #2d1a1a; color: var(--danger); border: 1px solid #5a2020; }
  .action-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; flex-shrink: 0;
    padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface); }
  /* messages */
  .msg { display: flex; flex-direction: column; margin-bottom: 12px; }
  .msg-meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg-bubble { padding: 10px 12px; border-radius: var(--radius-lg); line-height: 1.6;
    max-width: 90%; white-space: pre-wrap; word-break: break-word; }
  .msg-human .msg-bubble { background: var(--user-bg); align-self: flex-end; border-bottom-right-radius: 3px; }
  .msg-bot .msg-bubble { background: var(--bot-bg); align-self: flex-start; border-bottom-left-radius: 3px; }
  .msg-system .msg-bubble { background: #1a2a1a; border: 1px solid #2a4a2a; font-size: 12px; color: #86efac; }
  .compose { padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface);
    display: flex; gap: 8px; flex-shrink: 0; }
  .compose textarea { flex: 1; min-height: 56px; max-height: 140px; }
  .compose-btn { align-self: flex-end; }
  /* card */
  .card-section { margin-bottom: 16px; }
  .card-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 8px; }
  .card-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 10px; margin-bottom: 6px; font-size: 13px; }
  .card-item .item-id { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: #1e2a3e; color: var(--accent); margin-left: 6px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--danger);
    color: #fff; padding: 10px 16px; border-radius: var(--radius); font-size: 13px;
    max-width: 400px; z-index: 999; box-shadow: 0 4px 16px #0006; }
  .select-wrap { position: relative; }
  .select-wrap select { padding-right: 28px; }
  .collapse { cursor: pointer; }
  .collapse-body { margin-top: 8px; }
  .hidden { display: none !important; }
  details summary { list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details > summary { cursor: pointer; padding: 6px 0; color: var(--muted); font-size: 12px; }
  details[open] > summary { color: var(--text); }
  .tag { display: inline-block; background: #1a2535; border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 6px; font-size: 11px; color: var(--muted); }
  .runs-list { list-style: none; }
  .runs-list li { padding: 8px; border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); }
  #loading-overlay { position: fixed; inset: 0; background: #0f111799; display: flex;
    align-items: center; justify-content: center; z-index: 100; flex-direction: column; gap: 12px; }
  #loading-overlay .spinner { width: 32px; height: 32px; border-width: 3px; }
  #loading-overlay p { color: var(--muted); font-size: 13px; }
  .sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
</style>
</head>
<body>

<header>
  <div>◉ <strong>Pact</strong></div>
  <div class="meta" id="header-meta">conversation experiment</div>
</header>

<!-- Setup screen -->
<div id="setup-screen">
  <div id="setup-inner">
    <h2>Set up a decision session</h2>

    <div id="runs-section">
      <h3 style="font-size:13px;margin-bottom:8px;">Load a saved session</h3>
      <ul class="runs-list" id="runs-list"><li style="color:var(--muted);font-size:12px">Loading…</li></ul>
      <hr class="sep">
    </div>

    <h3 style="font-size:13px;margin-bottom:12px;">Start a new session</h3>
    <label>What decision is the group making?</label>
    <input type="text" id="f-question" value="Where should our group go for a hiking trip?">

    <label>Your participant name</label>
    <input type="text" id="f-human-name" value="You">

    <label>Number of simulated participants: <span id="bot-count-val">3</span></label>
    <input type="range" id="f-bot-count" min="1" max="5" value="3">

    <label>Maximum bot messages: <span id="max-turns-val">18</span></label>
    <input type="range" id="f-max-turns" min="1" max="60" value="18">

    <div class="checkbox-row">
      <input type="checkbox" id="f-mapping" checked>
      <label for="f-mapping">Record individual positions on the card</label>
    </div>

    <div id="bot-profiles-container"></div>

    <div style="margin-top:20px;">
      <button class="btn-primary" id="btn-start" onclick="startSession()">Start session</button>
    </div>
  </div>
</div>

<!-- Main screen (hidden until session loaded) -->
<div id="main-screen" class="hidden">
  <!-- Chat panel -->
  <div class="panel" style="flex: 1.1">
    <div class="panel-header">
      <span>Conversation</span>
      <span id="turn-counter" style="font-size:11px;color:var(--muted)"></span>
    </div>
    <div class="panel-body" id="messages"></div>
    <div class="compose">
      <textarea id="compose-text" placeholder="Your message…" rows="2"
        onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))sendMessage()"></textarea>
      <button class="btn-primary compose-btn" onclick="sendMessage()">Send</button>
    </div>
    <div class="action-bar">
      <button class="btn-secondary btn-sm" id="btn-next-bot" onclick="botTurn()">Next participant</button>
      <button class="btn-secondary btn-sm" id="btn-round" onclick="nextRound()">Next round</button>
      <button class="btn-secondary btn-sm" onclick="askHelp()">Ask Pact for help</button>
      <button class="btn-secondary btn-sm" onclick="newSession()" style="margin-left:auto">New session</button>
    </div>
  </div>

  <!-- Decision card panel -->
  <div class="panel" style="flex: 1">
    <div class="panel-header">
      <span>Decision card</span>
      <span id="card-version" style="font-size:11px;color:var(--muted)"></span>
    </div>
    <div class="panel-body" id="card-body"></div>
  </div>
</div>

<!-- Loading overlay -->
<div id="loading-overlay" class="hidden">
  <div class="spinner"></div>
  <p id="loading-msg">Working…</p>
</div>

<script>
// ── state ──────────────────────────────────────────────────────────────────
let SID = null;
let card = null;
let simulation = null;

const BOT_DEFAULTS = [
  ["Alex",   "experienced hiker",         "Prioritize challenging trails and explain what makes a route worthwhile."],
  ["Sam",    "budget-conscious planner",   "Keep costs manageable and ask for concrete cost assumptions."],
  ["Jordan", "accessibility-focused",      "Focus on practical access needs and travel burdens."],
  ["Casey",  "curious explorer",           "Value novelty but stay open to compromise."],
  ["Riley",  "logistics organizer",        "Look for timing, availability, and coordination risks."],
];

// ── init ───────────────────────────────────────────────────────────────────
(async function init() {
  renderBotProfiles();
  document.getElementById("f-bot-count").addEventListener("input", e => {
    document.getElementById("bot-count-val").textContent = e.target.value;
    renderBotProfiles();
  });
  document.getElementById("f-max-turns").addEventListener("input", e => {
    document.getElementById("max-turns-val").textContent = e.target.value;
  });
  await loadRuns();
})();

async function loadRuns() {
  try {
    const data = await api("GET", "/api/runs");
    const ul = document.getElementById("runs-list");
    if (!data.files.length) {
      ul.innerHTML = '<li style="color:var(--muted);font-size:12px;padding:4px">No saved sessions yet.</li>';
      return;
    }
    ul.innerHTML = data.files.map(f =>
      `<li><span style="font-size:12px">${f}</span>
       <button class="btn-secondary btn-sm" onclick="loadSession('${f}')">Load</button></li>`
    ).join("");
  } catch { /* ignore */ }
}

function renderBotProfiles() {
  const n = parseInt(document.getElementById("f-bot-count").value);
  const container = document.getElementById("bot-profiles-container");
  // preserve existing values
  const existing = Array.from(container.querySelectorAll(".bot-card")).map((el, i) => ({
    name: el.querySelector(`[data-field=name]`)?.value,
    role: el.querySelector(`[data-field=role]`)?.value,
    guidance: el.querySelector(`[data-field=guidance]`)?.value,
  }));
  container.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const [dname, drole, dguidance] = BOT_DEFAULTS[i];
    const ex = existing[i] || {};
    const name = ex.name || dname;
    const role = ex.role || drole;
    const guidance = ex.guidance || dguidance;
    container.innerHTML += `
    <details class="bot-card" ${i === 0 ? "open" : ""}>
      <summary>Simulated participant ${i+1}: ${name}</summary>
      <div class="bot-card-body">
        <label>Name</label><input type="text" data-field="name" data-idx="${i}" value="${esc(name)}">
        <label>Role</label><input type="text" data-field="role" data-idx="${i}" value="${esc(role)}">
        <label>High-level guidance</label><textarea data-field="guidance" data-idx="${i}">${esc(guidance)}</textarea>
        <div class="checkbox-row">
          <input type="checkbox" id="bot-map-${i}" checked>
          <label for="bot-map-${i}">Opts in to individual mapping</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="bot-share-${i}" checked>
          <label for="bot-share-${i}">Allows positions on shared card</label>
        </div>
      </div>
    </details>`;
  }
}

function collectBotProfiles() {
  const n = parseInt(document.getElementById("f-bot-count").value);
  const profiles = [];
  const container = document.getElementById("bot-profiles-container");
  const cards = container.querySelectorAll(".bot-card");
  for (let i = 0; i < n; i++) {
    const card = cards[i];
    profiles.push({
      name: card.querySelector("[data-field=name]").value.trim(),
      role: card.querySelector("[data-field=role]").value.trim(),
      guidance: card.querySelector("[data-field=guidance]").value.trim(),
      mapping_allowed: document.getElementById(`bot-map-${i}`).checked,
      share_allowed: document.getElementById(`bot-share-${i}`).checked,
    });
  }
  return profiles;
}

// ── session management ─────────────────────────────────────────────────────
async function startSession() {
  const question = document.getElementById("f-question").value.trim();
  const humanName = document.getElementById("f-human-name").value.trim();
  const maxTurns = parseInt(document.getElementById("f-max-turns").value);
  const mappingAllowed = document.getElementById("f-mapping").checked;
  const botProfiles = collectBotProfiles();
  if (!question || !humanName) { showError("Question and your name are required."); return; }
  loading("Starting session…");
  try {
    const data = await api("POST", "/api/sessions", {
      question, human_name: humanName, bot_profiles: botProfiles,
      max_bot_turns: maxTurns, mapping_allowed: mappingAllowed,
    });
    openSession(data);
  } catch(e) { showError(e.message); } finally { hideLoading(); }
}

async function loadSession(filename) {
  loading("Loading session…");
  try {
    const data = await api("POST", "/api/sessions/load", { filename });
    openSession(data);
  } catch(e) { showError(e.message); } finally { hideLoading(); }
}

function openSession(data) {
  SID = data.card.experiment_id;
  card = data.card;
  document.getElementById("setup-screen").classList.add("hidden");
  document.getElementById("main-screen").classList.remove("hidden");
  document.getElementById("header-meta").textContent = card.topic.title;
  renderAll(data);
}

function newSession() {
  SID = null; card = null;
  document.getElementById("main-screen").classList.add("hidden");
  document.getElementById("setup-screen").classList.remove("hidden");
  loadRuns();
}

// ── conversation ──────────────────────────────────────────────────────────
async function sendMessage() {
  const ta = document.getElementById("compose-text");
  const text = ta.value.trim();
  if (!text || !SID) return;
  ta.value = "";
  loading("Sending…");
  try {
    const data = await api("POST", `/api/sessions/${SID}/message`, { text });
    renderAll(data);
  } catch(e) { showError(e.message); ta.value = text; } finally { hideLoading(); }
}

async function botTurn() {
  loading("Simulated participant thinking…");
  try {
    const data = await api("POST", `/api/sessions/${SID}/bot-turn`);
    renderAll(data);
    hideLoading();
    pollForCardUpdate(data.card.card_version);
  } catch(e) { showError(e.message); hideLoading(); }
}

async function pollForCardUpdate(knownVersion) {
  // Poll until card_version increments (observe finished) or 30s timeout
  const deadline = Date.now() + 30000;
  const indicator = document.getElementById("card-version");
  const orig = indicator?.textContent || "";
  if (indicator) indicator.textContent = orig + " · updating…";
  while (Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 2000));
    try {
      const data = await api("GET", `/api/sessions/${SID}`);
      if (data.card.card_version > knownVersion) {
        renderAll(data);
        return;
      }
    } catch { break; }
  }
  if (indicator) indicator.textContent = orig; // timed out, restore
}

async function nextRound() {
  loading("Running next round…");
  try {
    const data = await api("POST", `/api/sessions/${SID}/round`);
    renderAll(data);
  } catch(e) { showError(e.message); } finally { hideLoading(); }
}

async function askHelp() {
  loading("Pact is reviewing the card…");
  try {
    const data = await api("POST", `/api/sessions/${SID}/help`);
    renderAll(data);
  } catch(e) { showError(e.message); } finally { hideLoading(); }
}

async function addClaim() {
  const input = document.getElementById("new-claim-input");
  const statement = input?.value?.trim();
  if (!statement) return;
  loading("Adding claim…");
  try {
    const data = await api("POST", `/api/sessions/${SID}/claims`, { statement });
    input.value = "";
    renderAll(data);
  } catch(e) { showError(e.message); } finally { hideLoading(); }
}

async function checkClaim(claimId) {
  loading("Checking claim…");
  try {
    const data = await api("POST", `/api/sessions/${SID}/check-claim/${claimId}`);
    renderAll(data);
  } catch(e) { showError(e.message); } finally { hideLoading(); }
}

async function recordDecision(proposalId, rationale) {
  loading("Recording decision…");
  try {
    const data = await api("POST", `/api/sessions/${SID}/decision`, { proposal_id: proposalId, rationale });
    renderAll(data);
  } catch(e) { showError(e.message); } finally { hideLoading(); }
}

async function confirmInterp(iid, text) {
  loading("Confirming interpretation…");
  try {
    const data = await api("POST", `/api/sessions/${SID}/confirm/${iid}`, { text });
    renderAll(data);
  } catch(e) { showError(e.message); } finally { hideLoading(); }
}

// ── render ─────────────────────────────────────────────────────────────────
function renderAll(data) {
  card = data.card;
  simulation = data.simulation;
  renderMessages();
  renderCard(data.calls || 0);
}

function renderMessages() {
  const participantMap = {};
  for (const p of card.participants) participantMap[p.id] = p;
  const container = document.getElementById("messages");
  container.innerHTML = card.messages.map(msg => {
    const person = participantMap[msg.speaker_id] || { name: msg.speaker_id };
    const cls = msg.source === "human" ? "msg-human" :
                msg.source === "explicit_request" ? "msg-system" : "msg-bot";
    const tag = msg.source === "simulated" ? " · simulated" :
                msg.source === "explicit_request" ? " · pact" : "";
    return `<div class="msg ${cls}">
      <div class="msg-meta">${esc(person.name)}${tag} · <span style="font-family:monospace;font-size:10px">${msg.id}</span></div>
      <div class="msg-bubble">${esc(msg.text)}</div>
    </div>`;
  }).join("");
  container.scrollTop = container.scrollHeight;

  const disabled = simulation.bot_turns >= simulation.max_bot_turns;
  document.getElementById("btn-next-bot").disabled = disabled;
  document.getElementById("btn-round").disabled = disabled;
  document.getElementById("turn-counter").textContent =
    `${simulation.bot_turns}/${simulation.max_bot_turns} bot msgs`;
}

function renderCard(calls) {
  document.getElementById("card-version").textContent = `v${card.card_version} · ${calls} API calls`;
  const body = document.getElementById("card-body");

  // Build public card (strip private fields) same logic as Python public_card()
  const publicPositions = (card.individual_mapping?.confirmed_positions || []).filter(p => {
    const perm = (card.individual_mapping?.participant_permissions || []).find(pp => pp.participant_id === p.participant_id);
    return perm?.sharing?.status === "granted" || p.participant_id === "human_admin";
  });

  let html = "";

  // Pact summary — shown first so it's immediately visible
  if (card.facilitation?.length) {
    const latest = card.facilitation[card.facilitation.length - 1];
    const o = latest.output;
    const text = typeof o === "object" ? (o.summary || o.decision_state || JSON.stringify(o)) : String(o);
    html += `<div class="card-section"><h3>Pact summary</h3>
      <div class="card-item" style="font-size:13px;white-space:pre-wrap;line-height:1.7">${esc(text)}</div>`;
    if (card.facilitation.length > 1)
      html += `<div style="font-size:11px;color:var(--muted);margin-top:4px">${card.facilitation.length} summaries — showing latest</div>`;
    html += `</div>`;
  }

  // Topic
  html += `<div class="card-section">
    <h3>Question</h3>
    <div class="card-item">${esc(card.topic.problem || card.topic.title)}</div>
  </div>`;

  // Sections
  const sections = [
    ["proposals", "Proposals", card.proposals],
    ["criteria", "Criteria", card.criteria],
    ["claims", "Claims", card.claims],
    ["assumptions", "Assumptions", card.assumptions],
    ["arguments", "Arguments", card.arguments],
    ["positions", "Shared individual positions", publicPositions],
    ["unresolved", "Open questions", card.unresolved],
  ];
  for (const [key, label, entries] of sections) {
    if (!entries?.length) continue;
    html += `<div class="card-section"><h3>${label}</h3>`;
    for (const entry of entries) {
      const title = entry.title || entry.statement || entry.question || JSON.stringify(entry);
      const src = (entry.source_message_ids || []).join(", ");
      html += `<div class="card-item">
        <div>${esc(title)}</div>
        <div class="item-id">${entry.id}${src ? " · src " + esc(src) : ""}</div>
      </div>`;
    }
    html += "</div>";
  }

  // Claim checks
  {
    html += `<div class="card-section"><h3>Claims</h3>`;
    if (card.claims?.length) {
      html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">`;
      for (const c of card.claims) {
        const label = `${esc(c.statement.slice(0,42))}${c.statement.length>42?"…":""}`;
        html += c.checkable === false
          ? `<button class="btn-secondary btn-sm" disabled
              title="Not checkable against public sources: ${esc(c.statement)}">Not checkable: ${label}</button>`
          : `<button class="btn-secondary btn-sm" onclick="checkClaim('${c.id}')"
              title="${esc(c.statement)}">Check: ${label}</button>`;
      }
      html += `</div>`;
    }
    html += `<div style="display:flex;gap:6px;margin-bottom:8px;">
      <input type="text" id="new-claim-input" placeholder="Add a claim to check…" style="flex:1;min-width:0"
        onkeydown="if(event.key==='Enter')addClaim()">
      <button class="btn-secondary btn-sm" onclick="addClaim()" style="white-space:nowrap">+ Add claim</button>
    </div>`;
    for (const result of (card.claim_checks || [])) {
      const label = result.ad_hoc_statement
        ? `Ad-hoc: ${result.ad_hoc_statement.slice(0,50)}…`
        : `Check ${result.id}`;
      html += `<details style="margin-bottom:6px">
        <summary>${esc(label)} · <span class="tag">${result.status}</span></summary>
        <div style="padding:8px 0;font-size:13px;white-space:pre-wrap">${esc(result.finding)}</div>`;
      for (const s of (result.sources || [])) {
        html += `<div style="margin-top:4px"><a href="${esc(s.url)}" target="_blank"
          style="color:var(--accent);font-size:12px">${esc(s.title)}</a></div>`;
      }
      html += `</details>`;
    }
    html += `</div>`;
  }


  // Pending interpretations for human
  const pending = (card.individual_mapping?.pending_interpretations || [])
    .filter(p => p.confirmation?.status === "pending" && p.participant_id === "human_admin");
  if (pending.length) {
    html += `<div class="card-section"><h3>Pending interpretations (yours)</h3>`;
    for (const item of pending) {
      const iid = item.id;
      html += `<div class="card-item">
        <div style="margin-bottom:6px">${esc(item.proposed_statement)}</div>
        <div class="item-id" style="margin-bottom:8px">src ${(item.source_message_ids||[]).join(", ")}</div>
        <input type="text" id="interp-text-${iid}" placeholder="Confirm or correct this interpretation">
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn-secondary btn-sm" onclick="confirmInterp('${iid}','Confirm this interpretation.')">Confirm</button>
          <button class="btn-secondary btn-sm" onclick="confirmInterp('${iid}',document.getElementById('interp-text-${iid}').value||'Confirm.')">Submit correction</button>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  // Record decision
  if (card.proposals?.length) {
    html += `<div class="card-section"><h3>Record a decision</h3>
      <div class="card-item">
        <label style="margin-top:0">Select proposal</label>
        <select id="decision-proposal">`;
    for (const p of card.proposals) {
      html += `<option value="${p.id}">${esc(p.title || p.id)}</option>`;
    }
    html += `</select>
        <label>Rationale</label>
        <input type="text" id="decision-rationale" placeholder="Optional rationale">
        <div style="margin-top:8px">
          <button class="btn-secondary btn-sm" onclick="recordDecision(
            document.getElementById('decision-proposal').value,
            document.getElementById('decision-rationale').value
          )">Record decision snapshot</button>
        </div>
      </div>
    </div>`;
  }

  // Decision status
  html += `<div class="card-section"><h3>Decision status</h3>
    <div class="card-item" style="font-size:12px;font-family:monospace;white-space:pre-wrap">${
      esc(JSON.stringify(card.decision, null, 2))
    }</div>
  </div>`;

  // Download link
  html += `<div style="margin-bottom:16px">
    <button class="btn-secondary btn-sm" onclick="downloadSession()">Download session JSON</button>
  </div>`;

  body.innerHTML = html;
}

function downloadSession() {
  const blob = new Blob([JSON.stringify({ card }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `pact-${card.experiment_id}.json`;
  a.click();
}

// ── utilities ──────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({ detail: res.statusText }));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

function esc(str) {
  return String(str ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function loading(msg) {
  document.getElementById("loading-msg").textContent = msg || "Working…";
  document.getElementById("loading-overlay").classList.remove("hidden");
}
function hideLoading() {
  document.getElementById("loading-overlay").classList.add("hidden");
}

let toastTimer;
function showError(msg) {
  clearTimeout(toastTimer);
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.textContent = msg;
  el.style.display = "block";
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 6000);
}
</script>
</body>
</html>
