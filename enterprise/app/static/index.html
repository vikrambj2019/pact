<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pact</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    min-height: 100vh;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  header span { font-size: 13px; color: #888; }

  .main { max-width: 860px; margin: 0 auto; padding: 32px 24px 64px; }

  /* ── input card ── */
  .card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .type-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .type-toggle button {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #d5d5d5;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: #555;
    transition: all .15s;
  }
  .type-toggle button.active {
    background: #1a1a1a;
    border-color: #1a1a1a;
    color: #fff;
  }

  textarea {
    width: 100%;
    height: 200px;
    border: 1px solid #d5d5d5;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    transition: border-color .15s;
    color: #1a1a1a;
  }
  textarea:focus { border-color: #1a1a1a; }
  textarea::placeholder { color: #aaa; }

  .input-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .char-count { font-size: 12px; color: #aaa; }

  .btn-analyze {
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-analyze:hover { background: #333; }
  .btn-analyze:disabled { background: #aaa; cursor: default; }

  .btn-reset {
    background: #fff;
    color: #555;
    border: 1px solid #d5d5d5;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-reset:hover { border-color: #999; color: #1a1a1a; }

  /* ── status ── */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    margin-bottom: 24px;
    font-size: 14px;
    color: #555;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #ddd;
    border-top-color: #1a1a1a;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-bar.error { border-color: #fca5a5; background: #fff5f5; color: #b91c1c; }
  .status-bar.error .spinner { display: none; }

  /* ── results ── */
  .section { margin-bottom: 24px; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    background: #f0f0f0;
    color: #666;
    border-radius: 10px;
    padding: 2px 8px;
  }

  /* summary */
  .summary-card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 20px 24px;
  }
  .summary-headline {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .summary-body {
    font-size: 13px;
    line-height: 1.7;
    color: #444;
  }
  .summary-body p { margin-bottom: 10px; }
  .summary-body p:last-child { margin-bottom: 0; }
  .summary-body p.sum-header {
    font-weight: 700;
    color: #1a1a1a;
    margin-top: 16px;
    margin-bottom: 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .summary-body ul {
    padding-left: 18px;
    margin-bottom: 10px;
  }
  .summary-body li { margin-bottom: 4px; }
  .summary-meta {
    margin-top: 12px;
    font-size: 12px;
    color: #aaa;
    border-top: 1px solid #f0f0f0;
    padding-top: 10px;
  }

  /* stance matrix */
  .stance-table-wrap { overflow-x: auto; }
  .stance-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    overflow: hidden;
  }
  .stance-table th {
    text-align: left;
    padding: 10px 14px;
    background: #fafafa;
    font-weight: 600;
    font-size: 12px;
    color: #666;
    border-bottom: 1px solid #e5e5e5;
    white-space: nowrap;
  }
  .stance-table td {
    padding: 10px 14px;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: top;
  }
  .stance-table tr:last-child td { border-bottom: none; }
  .option-title { font-weight: 500; max-width: 320px; }
  .option-q { font-size: 11px; color: #aaa; margin-top: 2px; }
  .option-status {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .opt-active    { background: #f0fdf4; color: #166534; }
  .opt-decided   { background: #eff6ff; color: #1d4ed8; }
  .opt-rejected  { background: #fef2f2; color: #991b1b; }
  .opt-withdrawn { background: #f9fafb; color: #9ca3af; }

  .stance-pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .s-support     { background: #f0fdf4; color: #166534; }
  .s-oppose      { background: #fef2f2; color: #991b1b; }
  .s-conditional { background: #fffbeb; color: #92400e; }
  .s-abstain     { background: #f9fafb; color: #9ca3af; }
  .s-withdrawn   { background: #f9fafb; color: #9ca3af; text-decoration: line-through; }

  /* list cards */
  .list-card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    overflow: hidden;
  }
  .list-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #d5d5d5;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .list-item-dot.open   { background: #f59e0b; }
  .list-item-dot.closed { background: #10b981; }
  .list-item-dot.block  { background: #ef4444; }

  .item-title { font-weight: 500; line-height: 1.4; }
  .item-meta  { font-size: 11px; color: #aaa; margin-top: 2px; }

  /* session footer */
  .session-footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .session-meta { font-size: 12px; color: #aaa; }
  .session-meta strong { color: #888; }

  /* flags */
  .flag-card {
    background: #fff8f0;
    border: 1px solid #fcd9a0;
    border-radius: 10px;
    overflow: hidden;
  }
  .flag-item {
    display: flex;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid #fde8c3;
    font-size: 12px;
    color: #78350f;
    line-height: 1.5;
  }
  .flag-item:last-child { border-bottom: none; }
  .flag-icon { flex-shrink: 0; margin-top: 1px; }

  .hidden { display: none !important; }

  /* participants strip */
  .participants { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .participant-chip {
    font-size: 12px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 20px;
    padding: 3px 10px;
    color: #555;
  }
</style>
</head>
<body>

<header>
  <h1>Pact</h1>
  <span>Decision Intelligence</span>
</header>

<div class="main">

  <!-- Input -->
  <div class="card" id="inputCard">
    <div class="type-toggle">
      <button class="active" data-type="auto">Auto-detect</button>
      <button data-type="email">Email chain</button>
      <button data-type="transcript">Meeting transcript</button>
    </div>
    <textarea id="inputText" placeholder="Paste an email chain or meeting transcript here…"></textarea>
    <div class="input-footer">
      <span class="char-count" id="charCount">0 characters</span>
      <div style="display:flex;gap:8px;">
        <button class="btn-reset" id="resetBtn">Reset</button>
        <button class="btn-analyze" id="analyzeBtn">Analyze</button>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar hidden" id="statusBar">
    <div class="spinner" id="spinner"></div>
    <span id="statusText">Starting…</span>
  </div>

  <!-- Results -->
  <div id="results" class="hidden">

    <!-- Participants -->
    <div class="participants" id="participantsStrip"></div>

    <!-- Summary -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">Summary</span>
      </div>
      <div class="summary-card">
        <div class="summary-headline" id="summaryHeadline"></div>
        <div class="summary-body" id="summaryBody"></div>
        <div class="summary-meta" id="summaryMeta"></div>
      </div>
    </div>

    <!-- Options & Stances -->
    <div class="section" id="optionsSection">
      <div class="section-header">
        <span class="section-title">Options &amp; Stances</span>
        <span class="badge" id="optionsBadge"></span>
      </div>
      <div class="stance-table-wrap">
        <table class="stance-table" id="stanceTable">
          <thead id="stanceHead"></thead>
          <tbody id="stanceBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Open Questions -->
    <div class="section" id="questionsSection">
      <div class="section-header">
        <span class="section-title">Open Questions</span>
        <span class="badge" id="questionsBadge"></span>
      </div>
      <div class="list-card" id="questionsList"></div>
    </div>

    <!-- Blockers & Actions -->
    <div class="section" id="blockersSection">
      <div class="section-header">
        <span class="section-title">Blockers &amp; Actions</span>
        <span class="badge" id="blockersBadge"></span>
      </div>
      <div class="list-card" id="blockersList"></div>
    </div>

    <!-- Flags -->
    <div class="section" id="flagsSection">
      <div class="section-header">
        <span class="section-title">Flags</span>
        <span class="badge" id="flagsBadge"></span>
      </div>
      <div class="flag-card" id="flagsList"></div>
    </div>

    <!-- Session footer -->
    <div class="session-footer">
      <div class="session-meta" id="sessionMeta"></div>
      <button class="btn-reset" id="resetBtnBottom">Reset &amp; start over</button>
    </div>

  </div><!-- /results -->
</div>

<script>
// ── state ────────────────────────────────────────────────────────────────────
let sourceType = 'auto';
let pollTimer = null;
let currentJobId = null;

// ── type toggle ──────────────────────────────────────────────────────────────
document.querySelectorAll('.type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sourceType = btn.dataset.type;
  });
});

// ── char count ───────────────────────────────────────────────────────────────
const inputText = document.getElementById('inputText');
const charCount = document.getElementById('charCount');
inputText.addEventListener('input', () => {
  const n = inputText.value.length;
  charCount.textContent = n.toLocaleString() + ' character' + (n !== 1 ? 's' : '');
});

// ── reset ─────────────────────────────────────────────────────────────────────
function resetAll() {
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  currentJobId = null;
  inputText.value = '';
  charCount.textContent = '0 characters';
  document.getElementById('analyzeBtn').disabled = false;
  hide('statusBar');
  hide('results');
}

document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('resetBtnBottom').addEventListener('click', resetAll);

// ── analyze ───────────────────────────────────────────────────────────────────
document.getElementById('analyzeBtn').addEventListener('click', async () => {
  const text = inputText.value.trim();
  if (!text) return;
  startAnalysis(text);
});

async function startAnalysis(text) {
  setStatus('running', 'Analyzing — this takes about 30–60 seconds…');
  hide('results');

  let jobId;
  try {
    const res = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, source_type: sourceType }),
    });
    const data = await res.json();
    if (!res.ok || !data.job_id) throw new Error(data.error || 'Server error');
    jobId = data.job_id;
    currentJobId = jobId;
  } catch (err) {
    setStatus('error', 'Failed to start: ' + err.message);
    return;
  }

  poll(jobId);
}

function poll(jobId) {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    try {
      const res = await fetch('/jobs/' + jobId);
      const data = await res.json();
      if (data.status === 'done') {
        hide('statusBar');
        renderResults(data.result, jobId, data.duration_seconds);
      } else if (data.status === 'failed') {
        setStatus('error', 'Analysis failed: ' + (data.error || 'unknown error'));
      } else {
        poll(jobId);
      }
    } catch (err) {
      setStatus('error', 'Poll error: ' + err.message);
    }
  }, 2000);
}

// ── render ────────────────────────────────────────────────────────────────────
function renderResults(r, jobId, duration) {
  // Participants
  const strip = document.getElementById('participantsStrip');
  strip.innerHTML = '';
  (r.participants || []).filter(p => p !== 'Unknown').forEach(p => {
    const chip = document.createElement('span');
    chip.className = 'participant-chip';
    chip.textContent = p;
    strip.appendChild(chip);
  });

  // Summary
  renderSummary(r.summary || '');

  // Options & stances
  renderOptions(r);

  // Questions
  const questions = (r.elements || []).filter(e => e.kind === 'question');
  renderList('questionsSection', 'questionsBadge', 'questionsList', questions,
    e => ({ title: e.title, meta: e.status === 'open' ? 'open' : e.status, dot: 'open' }));

  // Blockers + actions
  const blockers = (r.elements || []).filter(e => e.kind === 'blocker' || e.kind === 'action');
  renderList('blockersSection', 'blockersBadge', 'blockersList', blockers,
    e => ({ title: e.title, meta: e.kind + ' · ' + (e.status || 'open'), dot: e.kind === 'blocker' ? 'block' : 'open' }));

  // Flags / warnings
  const warnings = (r.warnings || []).filter(w => !w.startsWith('extract:') && !w.startsWith('bad '));
  renderFlags(warnings);

  // Session footer
  const chars = inputText.value.length;
  const metaEl = document.getElementById('sessionMeta');
  metaEl.innerHTML =
    `<strong>Session</strong> ${jobId.slice(0, 8)}… &nbsp;·&nbsp; ` +
    `<strong>Duration</strong> ${duration}s &nbsp;·&nbsp; ` +
    `<strong>Input</strong> ${chars.toLocaleString()} chars`;

  show('results');
}

function renderSummary(raw) {
  const lines = raw.split('\n');
  let headline = '';
  const bodyLines = [];
  const meta = [];
  let headlineSet = false;

  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed.toLowerCase().startsWith('marked ')) { meta.push(trimmed); continue; }
    if (!headlineSet && trimmed) { headline = trimmed; headlineSet = true; continue; }
    if (headlineSet) bodyLines.push(line);
  }

  // Trim leading blank lines from body
  while (bodyLines.length && !bodyLines[0].trim()) bodyLines.shift();

  document.getElementById('summaryHeadline').textContent = headline;
  document.getElementById('summaryBody').innerHTML = renderMarkdown(bodyLines.join('\n').trim());
  const metaEl = document.getElementById('summaryMeta');
  metaEl.textContent = meta.join(' · ');
  metaEl.style.display = meta.length ? '' : 'none';
}

function renderMarkdown(text) {
  return text
    // **bold** → <strong>
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // blank line between paragraphs
    .split(/\n{2,}/)
    .map(para => {
      const t = para.trim();
      if (!t) return '';
      // section header (starts with <strong> after stripping)
      if (t.startsWith('<strong>') && t.indexOf('</strong>') > -1) {
        const rest = t.slice(t.indexOf('</strong>') + 9).trim();
        const hdr = t.slice(8, t.indexOf('</strong>'));
        return `<p class="sum-header">${escHtml(hdr)}</p>` +
               (rest ? `<p>${mdLine(rest)}</p>` : '');
      }
      // bullet list (lines starting with -)
      if (t.includes('\n- ') || t.startsWith('- ')) {
        const items = t.split('\n').filter(l => l.trim());
        return '<ul>' + items.map(l => {
          const content = l.replace(/^-\s*/, '');
          return `<li>${mdLine(content)}</li>`;
        }).join('') + '</ul>';
      }
      return `<p>${mdLine(t)}</p>`;
    })
    .filter(Boolean)
    .join('');
}

function mdLine(s) {
  return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function renderOptions(r) {
  const options = (r.elements || []).filter(e => e.kind === 'option');
  if (!options.length) { hide('optionsSection'); return; }

  // Build stance map: optId -> participantName -> latest stance
  const stanceMap = {};
  for (const ev of (r.events || [])) {
    if (ev.kind !== 'stance') continue;
    if (!stanceMap[ev.element_id]) stanceMap[ev.element_id] = {};
    stanceMap[ev.element_id][ev.participant] = ev.payload.stance;
  }

  // Build question title map
  const qMap = {};
  for (const e of (r.elements || [])) {
    if (e.kind === 'question') qMap[e.id] = e.title;
  }

  // Participants who have at least one stance
  const activeParticipants = [...new Set(
    Object.values(stanceMap).flatMap(m => Object.keys(m))
  )].filter(p => p !== 'Unknown');

  document.getElementById('optionsBadge').textContent = options.length;

  // Header
  const head = document.getElementById('stanceHead');
  head.innerHTML = '<tr>' +
    '<th>Option</th>' +
    '<th>Status</th>' +
    activeParticipants.map(p => `<th>${escHtml(shortName(p))}</th>`).join('') +
    '</tr>';

  // Rows
  const body = document.getElementById('stanceBody');
  body.innerHTML = '';
  for (const opt of options) {
    const tr = document.createElement('tr');
    const stances = stanceMap[opt.id] || {};
    const qTitle = opt.question_id ? qMap[opt.question_id] : null;

    tr.innerHTML =
      `<td><div class="option-title">${escHtml(opt.title)}</div>` +
      (qTitle ? `<div class="option-q">re: ${escHtml(truncate(qTitle, 60))}</div>` : '') +
      `</td>` +
      `<td><span class="option-status ${statusClass(opt.status)}">${escHtml(opt.status || 'active')}</span></td>` +
      activeParticipants.map(p => {
        const s = stances[p];
        return `<td>${s ? `<span class="stance-pill ${stanceClass(s)}">${escHtml(s)}</span>` : ''}</td>`;
      }).join('');
    body.appendChild(tr);
  }

  show('optionsSection');
}

function renderList(sectionId, badgeId, listId, items, mapper) {
  if (!items.length) { hide(sectionId); return; }
  document.getElementById(badgeId).textContent = items.length;
  const list = document.getElementById(listId);
  list.innerHTML = '';
  for (const item of items) {
    const m = mapper(item);
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML =
      `<div class="list-item-dot ${m.dot || ''}"></div>` +
      `<div><div class="item-title">${escHtml(m.title)}</div>` +
      `<div class="item-meta">${escHtml(m.meta)}</div></div>`;
    list.appendChild(div);
  }
  show(sectionId);
}

function renderFlags(warnings) {
  if (!warnings.length) { hide('flagsSection'); return; }
  document.getElementById('flagsBadge').textContent = warnings.length;
  const list = document.getElementById('flagsList');
  list.innerHTML = '';
  for (const w of warnings) {
    const div = document.createElement('div');
    div.className = 'flag-item';
    div.innerHTML = `<span class="flag-icon">⚑</span><span>${escHtml(truncate(w, 180))}</span>`;
    list.appendChild(div);
  }
  show('flagsSection');
}

// ── helpers ───────────────────────────────────────────────────────────────────
function setStatus(type, msg) {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar' + (type === 'error' ? ' error' : '');
  document.getElementById('statusText').textContent = msg;
  document.getElementById('analyzeBtn').disabled = type === 'running';
  show('statusBar');
}

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function shortName(full) {
  // "Klein, Josh" → "Josh K." or keep as-is if short
  const parts = full.split(',').map(s => s.trim());
  if (parts.length === 2) return parts[1].split(' ')[0] + ' ' + parts[0][0] + '.';
  return full.length > 14 ? full.split(' ')[0] : full;
}

function statusClass(s) {
  return { active: 'opt-active', decided: 'opt-decided', rejected: 'opt-rejected', withdrawn: 'opt-withdrawn' }[s] || 'opt-active';
}

function stanceClass(s) {
  return { support: 's-support', oppose: 's-oppose', conditional: 's-conditional', abstain: 's-abstain', withdrawn: 's-withdrawn' }[s] || '';
}
</script>
